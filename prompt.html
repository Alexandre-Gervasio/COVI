<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Foto HEIC detectada</title>
<style>
:root{--bg:#fff;--tx:#14171c;--mut:#667085;--bd:#e2e5ea;--ac:#2f6fed;--act:#fff;--ok:#12805c;--er:#c4321c}
@media (prefers-color-scheme:dark){:root{--bg:#1a1d22;--tx:#eceef2;--mut:#98a1b0;--bd:#2b3038;--ac:#5b92ff;--act:#0b0d10;--ok:#4cc39a;--er:#ff7a63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:17px;margin:0 0 4px}
#nm{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:14px}
label{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.note{margin:0 0 14px;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--act);cursor:pointer;flex:1}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.5}
#st{margin-top:12px;font-size:13px;color:var(--mut)}
#st.ok{color:var(--ok)}#st.er{color:var(--er)}
</style>
</head>
<body>
<h1 id="t">Foto HEIC detectada</h1>
<div id="nm"></div>
<label>Formato de saída
  <select id="fmt"><option value="png">PNG (sem perda adicional)</option><option value="jpg">JPG (pode reduzir a qualidade)</option></select>
</label>
<p class="note">PNG preserva os pixels decodificados. JPG pode reduzir a qualidade.</p>
<div class="row"><button id="go">Converter</button><button id="no" class="g">Agora não</button></div>
<div id="st"></div>
<script src="node_modules/heic2any/dist/heic2any.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var files=JSON.parse(new URLSearchParams(location.search).get('files')||'[]');
var base=function(p){return p.split(/[\\/]/).pop()};
$('t').textContent=files.length>1?files.length+' fotos HEIC baixadas':'Foto HEIC baixada';
$('nm').textContent=files.length>1?files.map(base).join(', '):base(files[0]||'');
$('no').onclick=function(){window.api.closePopup()};

function toBlob(canvas,type,quality){return new Promise(function(resolve){canvas.toBlob(resolve,type,quality)})}
async function conv(p,format){
  var buf=await window.api.readFile(p);
  var res=await heic2any({blob:new Blob([buf]),toType:'image/png'});
  var png=Array.isArray(res)?res[0]:res;
  if(format==='png')return png;
  var bmp=await createImageBitmap(png);
  var canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;
  var context=canvas.getContext('2d');
  context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
  context.drawImage(bmp,0,0);
  var jpg=await toBlob(canvas,'image/jpeg',0.92);
  if(bmp.close)bmp.close();
  if(!jpg)throw new Error('Falha ao gerar o arquivo JPG.');
  return jpg;
}
$('go').onclick=async function(){
  var format=$('fmt').value;
  $('go').disabled=true;$('no').disabled=true;$('fmt').disabled=true;
  var ok=0,err=0;
  for(var i=0;i<files.length;i++){
    $('st').className='';$('st').textContent='Convertendo '+(i+1)+' de '+files.length+'…';
    try{var b=await conv(files[i],format);await window.api.writeNext(files[i],format,await b.arrayBuffer());ok++}catch(e){err++}
  }
  $('st').className=err?'er':'ok';
  $('st').textContent=ok+' convertida(s) na pasta Downloads'+(err?' · '+err+' com erro':'');
  setTimeout(function(){window.api.closePopup()},2200);
};
})();
</script>
</body>
</html>
