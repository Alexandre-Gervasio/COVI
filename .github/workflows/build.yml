name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; assets will be added to it."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "C.O.V.I. $GITHUB_REF_NAME" --generate-notes
          fi
  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist
      - name: Validate Windows updater installer name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content dist/latest.yml -Raw
          $expectedName = [regex]::Match($manifest, '(?m)^path:\s*(.+)\s*$').Groups[1].Value
          $installers = @(Get-ChildItem dist -File -Filter '*.exe')
          if (-not $expectedName -or $installers.Count -ne 1 -or $installers[0].Name -ne $expectedName) {
            throw "Windows updater manifest path '$expectedName' does not match the installer artifact."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: instalador-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: instalador-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers to public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
